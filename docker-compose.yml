services:
  relay:
    build:
      context: ./relay
    container_name: rui-relay
    environment:
      RELAY_SKIP_DIRECT: "0"
    restart: unless-stopped
    networks:
      - rui-net
    healthcheck:
      test: ["CMD", "bun", "healthcheck.js"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 15s
    labels:
      - "autoheal=true"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID}
    container_name: rui-app
    env_file: .env
    environment:
      RUI_RELAY_URL: http://relay:3001/Home/ObtenerDatosRUI
      HOSTNAME: "0.0.0.0"
    depends_on:
      - relay
    restart: unless-stopped
    networks:
      - rui-net
      - dokploy-network

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: rui-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 30
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  umami-db:
    image: postgres:16-alpine
    container_name: rui-umami-db
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB:-umami}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD:-umami_password}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${UMAMI_POSTGRES_USER:-umami}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - umami-net

  # Analytics self-hosted. Sin puerto publicado: se expone vía Dokploy con
  # dominio propio (consultarui.col0.com) a través de dokploy-network.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: rui-umami
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER:-umami}:${UMAMI_POSTGRES_PASSWORD:-umami_password}@umami-db:5432/${UMAMI_POSTGRES_DB:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:-cambia_este_secreto}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - umami-net
      - dokploy-network

networks:
  rui-net:
    driver: bridge
  umami-net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  umami-db-data:
