services:
  relay:
    build:
      context: ./relay
    container_name: rui-relay
    environment:
      RELAY_SKIP_DIRECT: "0"
    restart: unless-stopped
    networks:
      - rui-net

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    container_name: rui-app

    env_file: .env
    environment:
      RUI_RELAY_URL: http://relay:3001/Home/ObtenerDatosRUI
    depends_on:
      - relay
    restart: unless-stopped
    networks:
      - rui-net
      - dokploy-network

networks:
  rui-net:
    driver: bridge
  dokploy-network:
    external: true