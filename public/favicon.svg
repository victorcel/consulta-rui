  <!-- The "0" ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#cyan)" stroke-width="5"/>
  <!-- Inner node (the IoT dot) -->
  <circle cx="32" cy="32" r="4.5" fill="url(#cyan)"/>
  <!-- Connection nodes on the ring (cardinal points) -->
